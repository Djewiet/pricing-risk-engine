[project]
name = "pricing-risk-engine"
version = "0.1.0"
description = "Pricing and risk library with a distributed, real-time risk service."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "scipy-stubs>=1.14",
]
validation = [
    "QuantLib>=1.36",
]
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricer"]

[tool.uv]
default-groups = ["dev", "validation"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "validation", "examples"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "PT", "PL", "NPY", "D", "ANN", "TID", "PERF", "DTZ",
]
ignore = [
    "D105",    # magic methods are self-explanatory
    "D107",    # __init__ documented at class level
    "PLR0913", # pricing functions legitimately take many market inputs
    "PLR2004", # numeric literals are the point of quant code
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR"]
"validation/**" = ["D", "ANN", "PLR"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "validation", "examples"]

[[tool.mypy.overrides]]
module = ["QuantLib", "QuantLib.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pricer"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
